[project]
name = "skf2dxf"
version = "0.1.0"
description = "Convert AutoSketch (.skf) drawings to DXF without AutoSketch"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["ezdxf>=1.4"]

[project.scripts]
skf2dxf = "skf2dxf:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["skf2dxf.py", "patterns.json"]
